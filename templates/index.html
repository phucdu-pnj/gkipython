<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Báo Cáo Phân Tích & Mô Phỏng Chứng Khoán</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link ref="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
    </head>
    <body>
        <div class="container">
            <h1 class="text-center header-title">BÁO CÁO PHÂN TÍCH VÀ MÔ PHỎNG GIÁ CHỨNG KHOÁN</h1>

            <!--1. VIDEO ANIMATION-->
            <div class="card-custom">
                <h3 class="text-warning mb-3">1. VIDEO MÔ PHỎNG BIẾN ĐỘNG GIÁ THEO PHIÊN</h3>
                <div class="video-box">
                    <img src="{{ data.video_url }}" alt="Stock Simulation Video">
                </div>
                <div class="mt-3 text-center">
                    <span class="badge badge-ceil p-2">Gia Tran</span>
                    <span class="badge badge-floor p-2">Gia San</span>
                    <span class="badge badge-ref p-2">Tham Chieu</span>
                    <span class="badge badge-up p-2">Xanh (tang)</span>
                    <span class="badge badge-down p-2">Do (Giam)</span>
                </div>
            </div>
    </body>
</html>
